site_name: xtalk
docs_dir: .
repo_url: https://github.com/xcc-zach/xtalk
repo_name: xcc-zach/xtalk
theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
extra:
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 简体中文
      link: /zh/
      lang: zh
plugins:
  - search:
      separator: '[\s\u200b\-]'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: X-Talk Documentation
        - locale: zh
          name: 简体中文
          build: true
          site_name: X-Talk文档
          link: /zh/
          nav_translations:
            Home: 首页
            Tutorial: 教程
            Quickstart: 快速开始
            Docs: 文档
            # Tabs under Tutorial
            'Start the Server': 启动服务
            'Config the Server': 配置服务
            'Sample Config for Fully Local Deployment': 完全本地部署示例配置
            'Text Embedding': 文本嵌入
            'Tool Use': 使用工具
            'Introduce a New Model': 引入新模型
            'Customize the Service': 定制X-Talk服务
            Testing: 测试
            # Tabs under Docs
            'Supported Models': 支持的模型
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Tutorial:
      - 'Start the Server': tutorial/start_the_server.md
      - 'Config the Server': tutorial/config_the_server.md
      - 'Sample Config for Fully Local Deployment': tutorial/sample_config_for_fully_local_deployment.md
      - 'Text Embedding': tutorial/text_embedding.md
      - 'Tool Use': tutorial/tool_use.md
      - 'Introduce a New Model': tutorial/introduce_a_new_model.md
      - 'Customize the Service': tutorial/customize_the_service.md
      - Testing: tutorial/testing.md
  - Docs:
      - 'Supported Models': docs/supported_models.md