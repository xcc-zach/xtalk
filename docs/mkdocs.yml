site_name: xtalk
docs_dir: .
repo_url: https://github.com/xcc-zach/xtalk
repo_name: xcc-zach/xtalk
theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
extra:
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 简体中文
      link: /zh/
      lang: zh
plugins:
  - search:
      separator: '[\s\u200b\-]'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: X-Talk Documentation
        - locale: zh
          name: 简体中文
          build: true
          site_name: X-Talk文档
          link: /zh/
          nav_translations:
            Home: 首页
            Tutorial: 教程
            Quickstart: 快速开始
            Docs: 文档
            Developer: 开发者参考
            Recipe: Recipe
            Roadmap: 路线图
            # Tabs under Tutorial
            'Start the Service': 启动服务
            'Config the Service': 配置服务
            'Sample Config for Fully Local Deployment': 完全本地部署示例配置
            'Tool Use': 使用工具
            Bot2Bot: Bot2Bot
            'Introduce a New Model': 引入新模型
            'Customize the Service': 定制X-Talk服务
            Testing: 测试
            # Tabs under Docs
            'Overall Architecture': 整体架构
            'Supported Models': 支持的模型
            'Service Configuration': 服务配置项
            'ASR Design': ASR设计
            'TTS Design': TTS设计
            'Speech Enhancer Design': 语音增强设计
            'VAD Design': VAD设计
            'Turn Detector Design': Turn Detector设计
            'Model clone() and reset()': 模型对象的clone()与reset()语义
            'Tool Design': 工具调用
            # Tabs under API
            'Client': 客户端
            'Server': 服务端
markdown_extensions:
  - md_in_html
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Tutorial:
      - 'Start the Service': tutorial/start_the_service.md
      - 'Config the Service': tutorial/config_the_service.md
      - 'Introduce a New Model': tutorial/introduce_a_new_model.md
      - 'Customize the Service': tutorial/customize_the_service.md
      - 'Sample Config for Fully Local Deployment': tutorial/sample_config_for_fully_local_deployment.md
      - 'Tool Use': tutorial/tool_use.md
      - Testing: tutorial/testing.md
      - Bot2Bot: tutorial/bot2bot.md
  - Docs:
      - 'Overall Architecture': docs/system_design.md
      - 'Supported Models': docs/supported_models.md
      - 'Service Configuration': docs/service_config.md
      - 'Tool Design': docs/tool_design.md
      - 'ASR Design': docs/asr_design.md
      - 'TTS Design': docs/tts_design.md
      - 'Speech Enhancer Design': docs/speech_enhancer_design.md
      - 'VAD Design': docs/vad_design.md
      - 'Turn Detector Design': docs/turn_detector_design.md
      - 'Model clone() and reset()': docs/model_clone_reset.md
  - API:
      - 'Client': api/client/globals.md
      - 'Server': api/server/index.md
  - Developer:
      - Recipe: developer/recipe.md
      - Roadmap: developer/roadmap.md
