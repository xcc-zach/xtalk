<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        color: CanvasText;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 10px;
        background: transparent;
      }
      .board {
        padding: 16px;
        border: 1px solid rgb(127 127 127 / 22%);
        border-radius: 20px;
        background: rgb(255 255 255 / 4%);
      }
      .board-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      h1 {
        min-width: 0;
        margin: 0;
        font-size: 15px;
        font-weight: 650;
      }
      .revision {
        flex: none;
        padding: 3px 9px;
        border: 1px solid rgb(127 127 127 / 20%);
        border-radius: 999px;
        color: #35c6f4;
        font-size: 11px;
        font-weight: 620;
      }
      pre {
        margin: 0;
        max-height: 480px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 13px;
        line-height: 1.5;
      }
      .empty {
        padding: 26px 18px;
        border: 1px dashed rgb(127 127 127 / 28%);
        border-radius: 16px;
        color: rgb(127 127 127);
        font-size: 13px;
        text-align: center;
      }
      .status {
        margin-top: 8px;
        color: rgb(127 127 127);
        font-size: 11px;
        text-align: right;
      }
      .status:empty { display: none; }
    </style>
  </head>
  <body>
    <main class="board">
      <header class="board-header">
        <h1 data-i18n="白板">白板</h1>
        <span id="revision" class="revision"></span>
      </header>
      <pre id="text" hidden></pre>
      <div id="empty" class="empty" hidden>白板内容为空。</div>
      <footer id="status" class="status"></footer>
    </main>
    <script>
      const byId = (id) => document.getElementById(id);
      const parsePayload = (event) => {
        if (event.payload && typeof event.payload === "object") {
          return event.payload;
        }
        try {
          const decoded = JSON.parse(event.message);
          return decoded && typeof decoded === "object" ? decoded : null;
        } catch {
          return null;
        }
      };
      const render = (event) => {
        const snapshot = parsePayload(event);
        if (!snapshot || typeof snapshot.text !== "string") {
          return;
        }
        byId("revision").textContent =
          typeof snapshot.revision === "number" ? `revision ${snapshot.revision}` : "";
        byId("text").textContent = snapshot.text;
        byId("text").hidden = snapshot.text.length === 0;
        byId("empty").hidden = snapshot.text.length !== 0;
      };
      const renderStatus = (event) => {
        byId("status").textContent = typeof event.status === "string" ? event.status : "";
      };
      window.xtalkToolUI.emit((event) => render(event));
      window.xtalkToolUI.status((event) => renderStatus(event));
    </script>
  </body>
</html>
