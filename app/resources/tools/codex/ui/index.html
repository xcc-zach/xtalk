<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        color: CanvasText;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 6px; background: transparent; }
      .card {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 16px 18px;
        border: 1px solid rgb(127 127 127 / 22%);
        border-radius: 18px;
        background: rgb(255 255 255 / 4%);
      }
      .icon {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 15px;
        color: #111827;
        background: rgb(127 127 127 / 7%);
      }
      @media (prefers-color-scheme: dark) { .icon { color: #f5f5f5; } }
      .icon svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 2; }
      .copy { min-width: 0; }
      h1 { margin: 0; font-size: 17px; letter-spacing: -0.02em; }
      .status, .message, .meta { overflow-wrap: anywhere; color: rgb(127 127 127); }
      .status { margin-top: 4px; font-size: 13px; }
      .message { margin-top: 6px; max-height: 120px; overflow: hidden; font-size: 12px; white-space: pre-wrap; }
      .message:empty, .meta:empty { display: none; }
      .meta { margin-top: 5px; font-size: 11px; }
      .badge {
        padding: 8px 12px;
        border: 1px solid rgb(127 127 127 / 20%);
        border-radius: 12px;
        color: rgb(127 127 127);
        font-size: 12px;
        font-weight: 620;
      }
      .badge.complete { color: #16855b; }
      .badge.failed { color: #c2414b; }
      @media (max-width: 520px) {
        .card { grid-template-columns: 48px minmax(0, 1fr); padding: 14px; }
        .icon { width: 48px; height: 48px; }
        .badge { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <path d="M20 4.5a15.5 15.5 0 1 0 15.5 15.5A15.5 15.5 0 0 0 20 4.5Z"></path>
          <path d="M20 10v20M10 20h20M13 13l14 14M27 13 13 27"></path>
        </svg>
      </div>
      <div class="copy">
        <h1 id="title">Codex</h1>
        <div id="status" class="status">Preparing…</div>
        <div id="message" class="message"></div>
        <div id="meta" class="meta"></div>
      </div>
      <span id="badge" class="badge">Running</span>
    </main>
    <script>
      const { language } = window.xtalkToolUI.context;
      const locale = language.toLowerCase().startsWith("zh") ? "zh" : "en";
      const byId = (id) => document.getElementById(id);
      const copy = {
        en: {
          title: "Codex",
          preparing: "Preparing…",
          running: "Running",
          complete: "Complete",
          failed: "Failed",
          seconds: "s",
          actions: {
            codex_session_search: "Search session",
            codex_session_create: "New session",
            codex_session_continue: "Continue session",
            codex_session_set_model: "Change model",
            codex_session_delete: "Archive session",
          },
          statuses: {},
        },
        zh: {
          title: "Codex",
          preparing: "准备中…",
          running: "运行中",
          complete: "已完成",
          failed: "失败",
          seconds: "秒",
          actions: {
            codex_session_search: "搜索会话",
            codex_session_create: "新建会话",
            codex_session_continue: "继续会话",
            codex_session_set_model: "更改模型",
            codex_session_delete: "归档会话",
          },
          statuses: {
            "Creating Codex session": "正在创建 Codex 会话",
            "Searching Codex sessions": "正在搜索 Codex 会话",
            "Continuing Codex session": "正在继续 Codex 会话",
            "Updating Codex model": "正在更新 Codex 模型",
            "Archiving Codex session": "正在归档 Codex 会话",
            "Validating Codex model": "正在验证 Codex 模型",
            "Codex is working": "Codex 正在处理",
            "Codex completed": "Codex 已完成",
            "No Codex sessions found": "未找到 Codex 会话",
            "Resolving target session": "正在匹配目标会话",
            "Session search completed": "会话搜索已完成",
            "Codex model updated": "Codex 模型已更新",
            "Codex session archived": "Codex 会话已归档",
            "Stopping Codex": "正在停止 Codex",
            "Codex stopped": "Codex 已停止",
            "Codex failed": "Codex 失败",
          },
        },
      }[locale];
      const localizeStatus = (value, running, failed) => {
        const fallback = failed ? copy.failed : running ? copy.running : copy.complete;
        const raw = String(value || "");
        if (!raw) return fallback;
        const elapsedMatch = raw.match(/\s*·\s*(\d+)s$/i);
        const phase = elapsedMatch ? raw.slice(0, elapsedMatch.index).trim() : raw;
        let localized = copy.statuses[phase] || phase;
        if (locale === "zh" && phase.startsWith("Codex failed")) {
          localized = `${copy.statuses["Codex failed"]}${phase.slice("Codex failed".length)}`;
        }
        return elapsedMatch
          ? `${localized} · ${elapsedMatch[1]} ${copy.seconds}`
          : localized;
      };
      const render = (event, message = "") => {
        const failed = /failed|error/i.test(event.status || "");
        let displayMessage = message;
        let details = copy.actions[event.toolName] || String(event.toolName || "").replaceAll("_", " ");
        if (message.startsWith("{")) {
          try {
            const output = JSON.parse(message);
            displayMessage = output.message || message;
            const settings = [output.model, output.effort].filter(Boolean).join(" · ");
            details = [details, settings].filter(Boolean).join(" · ");
          } catch (_) {
            displayMessage = message;
          }
        }
        byId("title").textContent = copy.title;
        byId("status").textContent = localizeStatus(event.status, event.running, failed);
        byId("message").textContent = displayMessage;
        byId("meta").textContent = details;
        byId("badge").textContent = failed ? copy.failed : event.running ? copy.running : copy.complete;
        byId("badge").classList.toggle("complete", !event.running && !failed);
        byId("badge").classList.toggle("failed", failed);
      };
      byId("title").textContent = copy.title;
      byId("status").textContent = copy.preparing;
      byId("badge").textContent = copy.running;
      window.xtalkToolUI.status((event) => render(event));
      window.xtalkToolUI.emit((event) => render(event, event.message));
    </script>
  </body>
</html>
