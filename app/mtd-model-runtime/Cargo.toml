[package]
name = "xtalk-mtd-model-runtime"
version = "0.1.0"
description = "Native moss-transcribe.cpp service for XTalk Desktop"
edition = "2021"
rust-version = "1.88"
license = "MIT"
build = "build.rs"

[[bin]]
name = "xtalk-mtd-model-runtime"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
cc = "1.2"
