<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whiteboard</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: rgb(24 26 30 / 96%);
        --surface: rgb(255 255 255 / 5%);
        --border: rgb(127 127 127 / 20%);
        --text: CanvasText;
        --muted: rgb(127 127 127);
        --accent: #35c6f4;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 20px 22px 26px;
      }
      footer {
        flex: none;
        padding: 8px 18px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
        text-align: right;
      }
      footer:empty { display: none; }
      .empty {
        padding: 40px 22px;
        border: 1px dashed var(--border);
        border-radius: 16px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }
      .markdown-body { font-size: 14px; line-height: 1.65; }
      .markdown-body > :first-child { margin-top: 0; }
      .markdown-body > :last-child { margin-bottom: 0; }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4,
      .markdown-body h5,
      .markdown-body h6 {
        margin: 1.25em 0 0.5em;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .markdown-body h1 { font-size: 1.6em; }
      .markdown-body h2 { font-size: 1.35em; }
      .markdown-body h3 { font-size: 1.18em; }
      .markdown-body p { margin: 0.7em 0; }
      .markdown-body ul,
      .markdown-body ol { margin: 0.7em 0; padding-left: 1.6em; }
      .markdown-body li { margin: 0.25em 0; }
      .markdown-body blockquote {
        margin: 0.8em 0;
        padding: 2px 14px;
        border-left: 3px solid var(--accent);
        color: var(--muted);
      }
      .markdown-body code {
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--surface);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
      }
      .markdown-body pre {
        margin: 0.9em 0;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        overflow: auto;
      }
      .markdown-body pre code {
        padding: 0;
        background: transparent;
        font-size: 12.5px;
        line-height: 1.55;
      }
      .markdown-body a { color: var(--accent); }
      .markdown-body table {
        margin: 0.9em 0;
        border-collapse: collapse;
        font-size: 13px;
      }
      .markdown-body th,
      .markdown-body td {
        padding: 6px 12px;
        border: 1px solid var(--border);
        text-align: left;
      }
      .markdown-body th { background: var(--surface); }
      .markdown-body hr {
        margin: 1.2em 0;
        border: 0;
        border-top: 1px solid var(--border);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: rgb(250 250 250 / 98%);
          --surface: rgb(0 0 0 / 4%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="board" class="markdown-body"></div>
      <div id="empty" class="empty" hidden></div>
    </main>
    <footer id="status"></footer>
    <script type="module" src="/whiteboard.ts"></script>
  </body>
</html>
