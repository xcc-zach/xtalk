<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: CanvasText;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 6px;
        background: transparent;
      }

      .card {
        display: grid;
        padding: 20px 22px;
        align-items: center;
        grid-template-columns: 64px minmax(0, 1fr) auto;
        gap: 20px;
        border: 1px solid rgb(127 127 127 / 22%);
        border-radius: 20px;
        background: rgb(255 255 255 / 4%);
      }

      .icon {
        display: grid;
        width: 64px;
        height: 64px;
        place-items: center;
        border-radius: 17px;
        color: #35c6f4;
        background: rgb(127 127 127 / 7%);
      }

      .icon svg {
        width: 37px;
        height: 37px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.4;
      }

      .copy {
        min-width: 0;
      }

      .title {
        margin: 0;
        font-size: 18px;
        font-weight: 680;
        letter-spacing: -0.02em;
      }

      .status,
      .message {
        margin-top: 5px;
        color: rgb(127 127 127);
        font-size: 13px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .message:empty {
        display: none;
      }

      .progress {
        height: 4px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(127 127 127 / 16%);
      }

      .progress-value {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #35c6f4;
        transition: width 180ms ease;
      }

      .meta {
        display: flex;
        margin-top: 6px;
        align-items: center;
        justify-content: space-between;
        color: rgb(127 127 127);
        font-size: 11px;
      }

      .badge {
        min-width: 92px;
        padding: 10px 14px;
        border: 1px solid rgb(127 127 127 / 20%);
        border-radius: 14px;
        color: CanvasText;
        background: transparent;
        font-size: 14px;
        font-weight: 620;
        text-align: center;
      }

      .badge.complete {
        color: #16855b;
      }

      .badge.cancelled {
        color: rgb(127 127 127);
      }

      @media (max-width: 520px) {
        .card {
          padding: 16px;
          grid-template-columns: 52px minmax(0, 1fr);
          gap: 14px;
        }

        .icon {
          width: 52px;
          height: 52px;
          border-radius: 14px;
        }

        .icon svg {
          width: 31px;
          height: 31px;
        }

        .badge {
          display: none;
        }
      }

      :root[data-mode="history"] .card {
        padding: 16px 18px;
        grid-template-columns: 52px minmax(0, 1fr) auto;
        gap: 14px;
      }

      :root[data-mode="history"] .icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
      }

      :root[data-mode="history"] .icon svg {
        width: 31px;
        height: 31px;
      }

      :root[data-mode="history"] .status,
      :root[data-mode="history"] .message,
      :root[data-mode="history"] .progress,
      :root[data-mode="history"] #elapsed {
        display: none;
      }

      :root[data-mode="history"] .meta {
        margin-top: 5px;
        justify-content: flex-start;
        font-size: 13px;
      }

      :root[data-mode="history"] .badge {
        display: inline-block;
        min-width: 82px;
        padding: 9px 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="22" r="13"></circle>
          <path d="M20 22V14"></path>
          <path d="M20 22l6 4"></path>
          <path d="M15 4h10"></path>
          <path d="M20 4v5"></path>
        </svg>
      </div>
      <div class="copy">
        <h1 id="title" class="title">Timer</h1>
        <div id="status" class="status">Preparing…</div>
        <div id="message" class="message"></div>
        <div class="progress" aria-hidden="true">
          <div id="progress-value" class="progress-value"></div>
        </div>
        <div class="meta">
          <span id="elapsed">0 s</span>
          <span id="total">-- s</span>
        </div>
      </div>
      <span id="badge" class="badge">Running</span>
    </main>
    <script>
      const { language, mode } = window.xtalkToolUI.context;
      const locale = language.toLowerCase().startsWith("zh") ? "zh" : "en";
      const copy = {
        en: {
          title: "Timer",
          preparing: "Preparing…",
          running: "Running",
          complete: "Complete",
          cancelled: "Cancelled",
          seconds: "s",
        },
        zh: {
          title: "计时器",
          preparing: "准备中…",
          running: "运行中",
          complete: "已完成",
          cancelled: "已取消",
          seconds: "秒",
        },
      }[locale];
      document.documentElement.dataset.mode = mode;
      const title = document.querySelector("#title");
      const badge = document.querySelector("#badge");
      const status = document.querySelector("#status");
      const progressValue = document.querySelector("#progress-value");
      const elapsed = document.querySelector("#elapsed");
      const total = document.querySelector("#total");
      const message = document.querySelector("#message");

      const numbers = (value) =>
        Array.from(String(value).matchAll(/\d+(?:\.\d+)?/g), (match) =>
          Number(match[0]),
        );

      const renderStatus = (value, running, outcome) => {
        const resolvedOutcome = outcome || (running ? "running" : "complete");
        const cancelled = resolvedOutcome === "cancelled";
        status.textContent = cancelled
          ? copy.cancelled
          : running
            ? copy.running
            : copy.complete;
        const [used = 0, duration = Math.max(used, 1)] = numbers(value);
        const maximum = Math.max(duration, 1);
        const percentage = Math.min(100, Math.max(0, (used / maximum) * 100));
        progressValue.style.width = `${percentage}%`;
        elapsed.textContent = `${used} ${copy.seconds}`;
        total.textContent = `${duration} ${copy.seconds}`;
        badge.textContent = cancelled
          ? copy.cancelled
          : running
            ? copy.running
            : copy.complete;
        badge.classList.toggle("complete", resolvedOutcome === "complete");
        badge.classList.toggle("cancelled", cancelled);
      };

      title.textContent = copy.title;
      status.textContent = copy.preparing;
      badge.textContent = copy.running;
      window.xtalkToolUI.status((event) => {
        title.textContent = copy.title;
        renderStatus(event.status, event.running, event.outcome);
      });

      window.xtalkToolUI.emit((event) => {
        title.textContent = copy.title;
        message.textContent = event.message;
        renderStatus(event.status, event.running, event.outcome);
      });
    </script>
  </body>
</html>
