name: Secret Check

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  secret-scan:
    # Branch deletions also fire push events; there is nothing to check.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          extra_args: --results=verified,unknown
